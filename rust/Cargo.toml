[package]
name = "libloong"
version = "0.1.0"
edition = "2021"
authors = ["LibLoong Contributors"]
description = "Rust bindings for the libloong LoongArch emulator"
license = "MIT"
repository = "https://github.com/fwsGonzo/libloong"
categories = ["emulators", "simulation"]
keywords = ["loongarch", "emulator", "vm", "sandbox"]

[lib]
name = "libloong"
path = "src/lib.rs"

[dependencies]
# No runtime dependencies - only FFI to C++

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[dev-dependencies]
# For testing

[features]
default = []
# Enable binary translation support (requires LA_BINARY_TRANSLATION)
binary-translation = []

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "vmcall"
path = "examples/vmcall.rs"
