[package]
name = "libloong"
version = "0.1.0"
edition = "2021"
authors = ["LibLoong Contributors"]
description = "Rust bindings for the libloong LoongArch emulator - a high-performance 64-bit LoongArch virtual machine"
license-file = "LICENSE"
repository = "https://github.com/libriscv/libloong"
documentation = "https://docs.rs/libloong"
readme = "README.md"
categories = ["emulators", "simulation", "virtualization"]
keywords = ["loongarch", "emulator", "vm", "sandbox", "virtualization"]
include = [
    "src/**/*",
    "wrapper/**/*",
    "examples/**/*",
    "README.md",
    "LICENSE",
    "Cargo.toml",
    "build.rs",
    "_vendor/**/*",
    "!_vendor/**/*.bak"
]

[lib]
name = "libloong"
path = "src/lib.rs"

[dependencies]
# No runtime dependencies - only FFI to C++

[build-dependencies]
cc = "1.0"

[dev-dependencies]
# For testing

[features]
default = ["binary-translation"]
# Enable binary translation support (JIT compilation for better performance)
binary-translation = []

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "vmcall"
path = "examples/vmcall.rs"

[[example]]
name = "memory_ops"
path = "examples/memory_ops.rs"

[package.metadata.docs.rs]
# Docs.rs configuration
default-target = "x86_64-unknown-linux-gnu"
all-features = true

# System requirements note
[package.metadata.system-requirements]
cmake = "3.15+"
ninja = "optional, recommended for faster builds"
gcc = "14+ or clang 18+ (C++20 support required)"
